services:
  - type: web
    name: pradeep-mokashi-portfolio-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server/app.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PORTFOLIO_HOST
        value: 0.0.0.0
